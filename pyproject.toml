[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"


[project]
name = "shawaf-reid"
version = "0.1.0"
description = "Person Re-Identification module for SHAWAF"
requires-python = ">=3.10"

dependencies = [
    "numpy>=1.24,<3",
    "scipy>=1.10,<2",
]


[project.optional-dependencies]
fastreid = [
    "torch>=2.1",
    "torchvision>=0.16",
    "yacs>=0.1.8",
    "termcolor>=2.0",
    "tabulate>=0.9",
    "scikit-learn>=1.3",
    "opencv-python>=4.8",
    "gdown>=5.0",
    "faiss-cpu>=1.8",
    "tensorboard>=2.14",
    "Pillow>=10.0",
    "tqdm>=4.66",
]


[tool.setuptools.packages.find]
where = ["."]
include = ["reid*"]