[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "shawaf-reid"
version = "0.1.0"
description = "Person Re-Identification benchmarking framework for SHAWAF"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["."]
include = ["reid*"]
exclude = [
    "third_party*",
    "benchmarks*",
    "checkpoints*",
    "configs*",
    "data*",
    "scripts*",
]
